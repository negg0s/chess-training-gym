[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-training-gym"
version = "0.1.0"
description = "Synthetic chess training data utilities: game generation, position encoding, model evaluation, reporting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["click>=8.0"]
authors = [{ name = "negg0s" }]
keywords = ["chess", "training", "synthetic", "encoding", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "numpy>=1.23"]

[project.scripts]
chess-training-gym = "chess_training_gym.cli:main"
chess-gym = "chess_training_gym.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]